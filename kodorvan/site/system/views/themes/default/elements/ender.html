<div id="ender" class="unselectable">
	<button
		class=""
		title="Вернуться наверх"
		aria-label="Верхнуться наверх"
		onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
	>
		<img 
			class="icon" 
			src="/themes/{{ theme }}/images/icons/white/arrow-top.svg"
			width="24" 
			height="24"
			alt="↑"
			title="Вернуться наверх" 
			ondragstart="return false"
		>
	</button>
	<span>на этом всё</span>
</div>
